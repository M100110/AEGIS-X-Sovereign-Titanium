name: Build & Publish AEGIS-X Windows EXE Release

on:
  push:
    branches: [ main, genspark_ai_developer ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-apex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install MinGW-w64 & NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mingw-w64-x86-64 nsis

      - name: Compile Windows PE Icon & Manifest Resource (.syso)
        run: |
          cd build
          x86_64-w64-mingw32-windres aegisx.rc -O coff -o ../cmd/aegis/rsrc_windows_amd64.syso

      - name: Build Standalone Windows GUI Binary (AegisX.exe)
        run: |
          mkdir -p releases
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -H=windowsgui" -o releases/AegisX.exe ./cmd/aegis

      - name: Build Unified Enterprise Installer (AegisX-Installer.exe)
        run: |
          cd installer
          makensis aegisx_setup.nsi

      - name: Upload Windows EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AEGIS-X-v8.0-TITANIUM-Windows-x64
          path: |
            releases/AegisX-Installer.exe
            releases/AegisX.exe

      - name: Publish Official GitHub Release (Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.0.0-titanium
          name: "AEGIS-X v8.0 TITANIUM — Official Windows x64 Setup Wizard & Standalone EXE"
          body: |
            ## AEGIS-X v8.0 TITANIUM Sovereign OS, LAN/RF & Security Intelligence
            - **Enterprise Setup & Engine Verifier (`AegisX-Installer.exe`)**: Branded UI, clear 5-component interactive descriptions, pre-flight engine verification, optional 1-click Wireshark/Nmap/VC++ provisioning, and Opt-In Eco-Boot startup.
            - **Adaptive Eco-Standby Governor (`0.0%` Boot/Idle Strain)**: Zero background packets and `<0.02%` CPU whenever the dashboard browser tab is closed.
            - **True Subnet & Per-Device Deep Audit**: Auto-detects any gateway/subnet, router X.509 certificate, 33-port single-device audit, 6-ping jitter test, Custom IP scanner, and Wake-on-LAN.
            - **72 Silent Native Windows Repair Tools + Adjustable RF Tomography Radar (`0.7x`–`2.2x`)**.
          files: |
            releases/AegisX-Installer.exe
            releases/AegisX.exe
